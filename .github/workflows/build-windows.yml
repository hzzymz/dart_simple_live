name: Build SimpleLive Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      
      - name: Set Dart mirror
        run: echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Get dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Windows Release（强制VS2022生成器）
        working-directory: simple_live_app
        run: flutter build windows --release --cmake-args="-G" "Visual Studio 17 2022"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Windows
          path: simple_live_app/build/windows/x64/release/
